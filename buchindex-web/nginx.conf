# Login gate in front of the buchindex admin dashboard (meilisearch-ui), published on HOST_IP.
# The dashboard pages need the Basic-Auth login below. The Meilisearch API under /api/ has no
# extra login: it needs the Meilisearch master key, which the dashboard asks for.
# The dashboard calls the API under /api/, so the dashboard's instance URL is http://<HOST_IP>:<port>/api.
server {
    listen 80;
    server_tokens off;
    client_max_body_size 100m;

    auth_basic "buchindex";
    auth_basic_user_file /etc/nginx/htpasswd;

    location /api/ {
        auth_basic off;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://meilisearch:7700;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://meilisearch-ui:24900;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Pet tagger (immich-pet-tagger), same login as the dashboard. It has its own port, so it runs at the root path.
server {
    listen 8086;
    server_tokens off;
    client_max_body_size 100m;

    auth_basic "buchindex";
    auth_basic_user_file /etc/nginx/htpasswd;

    location / {
        proxy_pass http://immich-pet-tagger:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
