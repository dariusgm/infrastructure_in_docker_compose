# Generic URL proxy with a shared cache.
#
# Request form:  http://<host>:8081/proxy/<https|http>/<upstream host>/<path>
# Example:       http://<host>:8081/proxy/https/github.com/prometheus/node_exporter/releases/...
#
# Any host can be reached through it, so the port is bound to HOST_IP only (see compose.yaml).
user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    proxy_cache_path /var/cache/nginx/url_proxy levels=1:2 keys_zone=url_proxy_cache:10m
                     max_size=1g inactive=24h use_temp_path=off;

    server {
        listen 8081;

        location ~ ^/proxy/(https?)/([^/]+)(/.*)$ {
            resolver 1.1.1.1 valid=10s;

            set $target_scheme $1;
            set $target_upstream $2;
            set $target_path $3;

            # With a variable in proxy_pass, nginx forwards the incoming URI unchanged unless a
            # URI is given here. The path after the upstream host is passed explicitly.
            proxy_pass $target_scheme://$target_upstream$target_path$is_args$args;

            proxy_read_timeout 300;
            proxy_connect_timeout 300;

            # TLS towards the upstream: send SNI and verify the certificate.
            proxy_ssl_server_name on;
            proxy_ssl_verify on;
            proxy_ssl_verify_depth 3;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

            proxy_cache url_proxy_cache;
            proxy_cache_valid 200 302 48h;
            proxy_cache_use_stale error timeout updating;

            proxy_set_header Host $target_upstream;
            proxy_set_header Accept-Encoding "";
            add_header X-Cache-Status $upstream_cache_status;
        }

        location / {
            return 404;
        }
    }
}
