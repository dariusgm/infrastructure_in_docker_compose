# Stack definition. Every component keeps its state in a bind mount below ${DATA_DIR}
# (outside this repository), so data survives re-deploys, compose file changes and
# removed or re-created containers.
#
# Published ports are bound to HOST_IP, so they listen on the host's LAN address only.
# Docker runs rootless, which publishes ports through host sockets, so the host firewall
# (ufw, see README.md "Network rules") applies to them.
#
# Images are pinned to a version. Upgrade by changing the tag, reading the release notes
# and taking a backup first (see backup/README.md).
name: infrastructure

# Log rotation for every container, so logs cannot fill the disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Services that only other containers need. Containers on this network have no route to
# the internet.
networks:
  backend:
    internal: true
  # Immich's internal services (database, cache, machine learning). Own network, so they
  # do not share a network with the Paperless services. See immich/README.md.
  immich-backend:
    internal: true
  # Prometheus and Grafana. Prometheus reaches its targets through it. See monitoring/README.md.
  monitoring:
    internal: true

services:
  # Ubuntu package cache for every system on the network. Clients point apt at
  # http://${HOST_IP}:3142 (see apt-cache/README.md). Cached data lives below DATA_DIR.
  apt-cache:
    build: ./apt-cache
    restart: unless-stopped
    logging: *logging
    ports:
      - "${HOST_IP}:3142:3142"
    volumes:
      - ${DATA_DIR}/apt-cache/apt-cacher-ng:/var/cache/apt-cacher-ng

  # Generic URL proxy with a shared cache for other downloads (see url-proxy/README.md).
  url-proxy:
    build: ./url-proxy
    restart: unless-stopped
    logging: *logging
    ports:
      - "${HOST_IP}:8081:8081"
    volumes:
      - ${DATA_DIR}/apt-cache/url-proxy:/var/cache/nginx/url_proxy

  # Network-wide DNS server with ad and tracker blocking (see pihole/README.md).
  # Clients use HOST_IP as their DNS server. Admin UI: http://${HOST_IP}:8082/admin
  pihole:
    image: pihole/pihole:2026.09.0
    restart: unless-stopped
    logging: *logging
    environment:
      FTLCONF_webserver_api_password: ${PIHOLE_PASSWORD:?Set PIHOLE_PASSWORD in .env}
      FTLCONF_dns_upstreams: ${PIHOLE_UPSTREAM_DNS:-88.134.230.225;88.134.230.161;1.1.1.1;9.9.9.9}
      # Answer queries from every network the host is on, not only the container's own subnet.
      FTLCONF_dns_listeningMode: all
      TZ: ${PIHOLE_TIMEZONE:-UTC}
    ports:
      - "${HOST_IP}:53:53/tcp"
      - "${HOST_IP}:53:53/udp"
      - "${HOST_IP}:8082:80"
    volumes:
      - ${DATA_DIR}/pihole/etc-pihole:/etc/pihole
      - ${DATA_DIR}/pihole/etc-dnsmasq.d:/etc/dnsmasq.d
    healthcheck:
      test: ["CMD", "dig", "+short", "+time=3", "@127.0.0.1", "pi.hole"]
      interval: 30s
      timeout: 10s
      retries: 3

  # --- Paperless-ngx: document management (see paperless/README.md) ---
  # Each supporting service runs in its own container. Only the web UI is published.

  # Web UI, API, consumer and scheduler of Paperless-ngx.
  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:3.3.4
    restart: unless-stopped
    logging: *logging
    depends_on:
      paperless-db:
        condition: service_healthy
      paperless-broker:
        condition: service_healthy
      paperless-gotenberg:
        condition: service_started
      paperless-tika:
        condition: service_started
    # "default" keeps the published port reachable; "backend" connects to the internal services.
    networks:
      - default
      - backend
    ports:
      - "${HOST_IP}:8083:8000"
    security_opt:
      - no-new-privileges:true
    environment:
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY:?Set PAPERLESS_SECRET_KEY in .env}
      # Address in the browser. Used for links, CSRF and allowed hosts.
      PAPERLESS_URL: ${PAPERLESS_URL:-http://${HOST_IP}:8083}
      PAPERLESS_ADMIN_USER: ${PAPERLESS_ADMIN_USER:?Set PAPERLESS_ADMIN_USER in .env}
      PAPERLESS_ADMIN_PASSWORD: ${PAPERLESS_ADMIN_PASSWORD:?Set PAPERLESS_ADMIN_PASSWORD in .env}
      PAPERLESS_ADMIN_MAIL: ${PAPERLESS_ADMIN_MAIL:-}
      PAPERLESS_TIME_ZONE: ${PAPERLESS_TIMEZONE:-UTC}
      PAPERLESS_OCR_LANGUAGE: ${PAPERLESS_OCR_LANGUAGE:-deu+eng}
      PAPERLESS_DBENGINE: postgresql
      PAPERLESS_DBHOST: paperless-db
      PAPERLESS_DBNAME: paperless
      PAPERLESS_DBUSER: paperless
      PAPERLESS_DBPASS: ${PAPERLESS_DB_PASSWORD:?Set PAPERLESS_DB_PASSWORD in .env}
      PAPERLESS_REDIS: redis://:${PAPERLESS_BROKER_PASSWORD:?Set PAPERLESS_BROKER_PASSWORD in .env}@paperless-broker:6379
      # Network shares do not report new files reliably, so the consumer polls the folder.
      PAPERLESS_CONSUMER_POLLING_INTERVAL: "10"
      PAPERLESS_TIKA_ENABLED: "true"
      PAPERLESS_TIKA_ENDPOINT: http://paperless-tika:9998
      PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://paperless-gotenberg:3000
    volumes:
      - ${DATA_DIR}/paperless/data:/usr/src/paperless/data
      - ${DATA_DIR}/paperless/media:/usr/src/paperless/media
      - ${DATA_DIR}/paperless/export:/usr/src/paperless/export
      # SMB share from the NAS, mounted on the host by server/consume-mount.sh.
      - /mnt/paperless-consume:/usr/src/paperless/consume

  # PostgreSQL database. Version 18 keeps its files below /var/lib/postgresql.
  paperless-db:
    image: docker.io/library/postgres:18.6-trixie
    restart: unless-stopped
    logging: *logging
    networks:
      - backend
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: ${PAPERLESS_DB_PASSWORD:?Set PAPERLESS_DB_PASSWORD in .env}
    volumes:
      - ${DATA_DIR}/paperless/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperless -d paperless"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Task broker (Valkey, Redis-compatible). Holds the queue of pending document tasks.
  # Append-only persistence keeps queued tasks across restarts. The password is required.
  paperless-broker:
    image: docker.io/valkey/valkey:9-alpine
    restart: unless-stopped
    logging: *logging
    networks:
      - backend
    environment:
      PAPERLESS_BROKER_PASSWORD: ${PAPERLESS_BROKER_PASSWORD:?Set PAPERLESS_BROKER_PASSWORD in .env}
      # Read by valkey-cli, so the health check can authenticate.
      REDISCLI_AUTH: ${PAPERLESS_BROKER_PASSWORD}
    command:
      - sh
      - -c
      - exec valkey-server --appendonly yes --requirepass "$$PAPERLESS_BROKER_PASSWORD"
    volumes:
      - ${DATA_DIR}/paperless/valkey:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Converts Office documents and e-mails to PDF. Its chromium route has JavaScript and
  # external content disabled, so mails cannot load tracking pixels or scripts.
  paperless-gotenberg:
    image: docker.io/gotenberg/gotenberg:8.37
    restart: unless-stopped
    logging: *logging
    networks:
      - backend
    command:
      - gotenberg
      - --chromium-disable-javascript=true
      - --chromium-allow-list=^file:///tmp/.*
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 5

  # Apache Tika extracts text and metadata from Office documents.
  paperless-tika:
    image: docker.io/apache/tika:3.3.1.0
    restart: unless-stopped
    logging: *logging
    networks:
      - backend
    healthcheck:
      # Tika has no HTTP client tools in its image. An open TCP port shows it is listening.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9998"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  # Backups of the Paperless database, the Paperless files and the Pi-hole databases.
  # See backup/README.md for what is stored, where, and how to restore it.
  backup:
    build: ./backup
    restart: unless-stopped
    logging: *logging
    depends_on:
      paperless-db:
        condition: service_healthy
    networks:
      - backend
    environment:
      # libpq reads these for pg_dump and pg_restore.
      PGHOST: paperless-db
      PGUSER: paperless
      PGDATABASE: paperless
      PGPASSWORD: ${PAPERLESS_DB_PASSWORD:?Set PAPERLESS_DB_PASSWORD in .env}
      BACKUP_KEEP_COUNT: ${BACKUP_KEEP_COUNT:-14}
    volumes:
      - ${DATA_DIR}/backup:/backup
      - ${DATA_DIR}/paperless/data:/source/paperless/data:ro
      - ${DATA_DIR}/paperless/media:/source/paperless/media:ro
      # Read-write: SQLite may need to write its -wal and -shm files while it reads.
      - ${DATA_DIR}/pihole/etc-pihole:/source/pihole
    healthcheck:
      # Fails when the last successful backup is older than 48 hours.
      test: ["CMD-SHELL", "test -n \"$(find /backup/status/last-success -mmin -2880 2>/dev/null)\""]
      interval: 15m
      timeout: 5s
      retries: 3
      start_period: 5m

  # Start page with links to the web interfaces of the stack, on one port (8080). Static,
  # built from dashboard/. Links use the host name the page is opened with.
  dashboard:
    build: ./dashboard
    image: infrastructure-dashboard:1
    pull_policy: build
    restart: unless-stopped
    logging: *logging
    ports:
      - "${HOST_IP}:8080:8080"

  # --- Immich: photo archive with CPU-based smart search and face recognition ---
  # Originals are mounted read-only. See immich/README.md for the volumes, the backups and
  # the manual steps after the first start.

  # Web UI and API. The only Immich service with a published port.
  immich-server:
    image: ghcr.io/immich-app/immich-server:v3.3.5
    restart: unless-stopped
    logging: *logging
    depends_on:
      immich-db:
        condition: service_healthy
      immich-redis:
        condition: service_healthy
      immich-machine-learning:
        condition: service_started
    # "default" keeps the published port reachable; "immich-backend" connects to the internal services.
    networks:
      - default
      - immich-backend
    ports:
      - "${HOST_IP}:2283:2283"
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: ${IMMICH_TIMEZONE:-UTC}
      DB_HOSTNAME: immich-db
      DB_USERNAME: immich
      DB_PASSWORD: ${IMMICH_DB_PASSWORD:?Set IMMICH_DB_PASSWORD in .env}
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: immich-redis
      REDIS_PASSWORD: ${IMMICH_REDIS_PASSWORD:?Set IMMICH_REDIS_PASSWORD in .env}
    volumes:
      # Writable: thumbnails, transcoded videos, Immich's own database dumps and files uploaded
      # through the app. Only the thumbnails are regenerable. See immich/README.md.
      - ${DATA_DIR}/immich/upload:/data
      # Read-only: the original photos, one folder per NAS share (1, 2, 3), mounted by
      # server/immich-originals-mount.sh. Each folder is added as its own external library.
      - /mnt/immich-originals/1:/mnt/originals/1:ro
      - /mnt/immich-originals/2:/mnt/originals/2:ro
      - /mnt/immich-originals/3:/mnt/originals/3:ro
      - /etc/localtime:/etc/localtime:ro

  # CLIP embeddings (smart search) and face recognition. CPU image. Needs outbound access once,
  # to download its models (see immich/README.md).
  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:v3.3.5
    restart: unless-stopped
    logging: *logging
    networks:
      - immich-backend
      - default
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: ${IMMICH_TIMEZONE:-UTC}
    volumes:
      - ${DATA_DIR}/immich/model-cache:/cache

  # PostgreSQL 18 with pgvector and VectorChord, built from immich/db/Dockerfile on the
  # official postgres:18.6 image. Not the Paperless database. See immich/README.md.
  immich-db:
    build: ./immich/db
    image: infrastructure-immich-db:18.6-vectorchord1.1.1
    # Built locally from immich/db, never pulled. Without this, Compose tries to pull the
    # image name first and fails on a host where it was not built yet.
    pull_policy: build
    restart: unless-stopped
    logging: *logging
    networks:
      - immich-backend
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD:?Set IMMICH_DB_PASSWORD in .env}
      POSTGRES_USER: immich
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      # PostgreSQL 18 keeps its files below /var/lib/postgresql (not .../data).
      - ${DATA_DIR}/immich/postgres18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U immich -d immich"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Valkey (Redis-compatible) cache and job queue for Immich. Password required. No volume:
  # Immich rebuilds its content, so it needs neither persistence nor backup.
  immich-redis:
    image: docker.io/valkey/valkey:9@sha256:c123e3715db63d06d4ad6964884037aa0d5d4d703939b9929954112889708e1d
    restart: unless-stopped
    logging: *logging
    networks:
      - immich-backend
    security_opt:
      - no-new-privileges:true
    environment:
      IMMICH_REDIS_PASSWORD: ${IMMICH_REDIS_PASSWORD:?Set IMMICH_REDIS_PASSWORD in .env}
      # Read by valkey-cli, so the health check can authenticate.
      REDISCLI_AUTH: ${IMMICH_REDIS_PASSWORD}
    command:
      - sh
      - -c
      - exec valkey-server --requirepass "$$IMMICH_REDIS_PASSWORD"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Monitoring: Prometheus collects metrics, Grafana shows them (see monitoring/README.md) ---
  # Prometheus is reachable only through Grafana, so it publishes no port. The monitoring
  # network is internal, and Grafana also joins the default network to publish its port.

  # One-shot: gives the Prometheus and Grafana data directories to the UIDs the images run
  # as. Under rootless Docker, container UID N maps to a subordinate host UID, so the
  # directories created by the deploy user are not writable by the container users.
  monitoring-init:
    image: docker.io/library/busybox:1.37.0
    restart: "no"
    logging: *logging
    command:
      - sh
      - -c
      - chown -R 65534:65534 /prometheus && chown -R 472:0 /grafana
    volumes:
      - ${DATA_DIR}/monitoring/prometheus:/prometheus
      - ${DATA_DIR}/monitoring/grafana:/grafana

  # Time series database. Scrapes the targets listed in monitoring/prometheus/prometheus.yml.
  prometheus:
    image: docker.io/prom/prometheus:v3.15.1
    restart: unless-stopped
    logging: *logging
    depends_on:
      monitoring-init:
        condition: service_completed_successfully
    networks:
      - monitoring
    security_opt:
      - no-new-privileges:true
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${DATA_DIR}/monitoring/prometheus:/prometheus
    healthcheck:
      test: ["CMD", "promtool", "check", "healthy", "--url", "http://localhost:9090"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Dashboards. Web UI on port 3000 of HOST_IP. Only the admin account can sign in.
  grafana:
    image: docker.io/grafana/grafana:13.2.4
    restart: unless-stopped
    logging: *logging
    depends_on:
      monitoring-init:
        condition: service_completed_successfully
      prometheus:
        condition: service_healthy
    networks:
      - default
      - monitoring
    security_opt:
      - no-new-privileges:true
    ports:
      - "${HOST_IP}:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # The stack has no route to the internet, so no update checks and no telemetry.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ${DATA_DIR}/monitoring/grafana:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana-dashboards:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # --- Vaultwarden: password manager, Rust server for the Bitwarden clients (see vaultwarden/README.md) ---
  # One container, SQLite database below DATA_DIR. No internal services needed.
  vaultwarden:
    image: docker.io/vaultwarden/server:1.37.4
    restart: unless-stopped
    logging: *logging
    security_opt:
      - no-new-privileges:true
    ports:
      - "${HOST_IP}:8084:80"
    environment:
      # Address the clients and the web vault use. Links are built from it.
      DOMAIN: ${VAULTWARDEN_URL:-http://${HOST_IP}:8084}
      # Creating accounts is off by default. Set to true only to create the first account, then back to false.
      SIGNUPS_ALLOWED: ${VAULTWARDEN_SIGNUPS_ALLOWED:-false}
      # Password for the admin page at /admin. Required.
      ADMIN_TOKEN: ${VAULTWARDEN_ADMIN_TOKEN:?Set VAULTWARDEN_ADMIN_TOKEN in .env}
      # HTTPS. Browsers only run the web vault's crypto on a secure context. The certificate is
      # issued by the local CA in ${DATA_DIR}/vaultwarden-tls (see vaultwarden/README.md).
      ROCKET_TLS: '{certs="/tls/cert.pem",key="/tls/key.pem"}'
    volumes:
      - ${DATA_DIR}/vaultwarden:/data
      - ${DATA_DIR}/vaultwarden-tls:/tls:ro

# Example component:
#
#  example:
#    image: <image>:<tag>
#    restart: unless-stopped
#    logging: *logging
#    ports:
#      - "${HOST_IP}:8080:80"
